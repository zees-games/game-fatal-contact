# game-arena: every key of this file at its code default, commented out. Uncomment a line to change it;
# an operator overrides in cfg/server/game/game-arena/config_players/game.yml. Layers: defaults < this < env < argv.

# --- Players
# Health a player spawns with and heals up to. [1.0..1000.0]
# player_health: 100.0
# Armour a player can carry. [0.0..1000.0]
# player_armour: 100.0
# Health regained per second; 0 keeps health a pickup. [0.0..100.0]
# player_regen: 0.0
# How far under an imported map's bounds a player is counted as out of it, metres. [1.0..200.0]
# fall_out_depth: 10.0
# Standing height of every avatar and its collision hull, in map units (the classic shooter's player is 72). ... [16.0..400.0]
# avatar_height_units: 72.0
# Crouched height in map units (36 in the classic shooter). [8.0..400.0]
# avatar_crouch_units: 36.0
# Half the hull's width in map units (16, a 32 wide hull). [2.0..100.0]
# avatar_radius_units: 16.0
# Metres in a map unit. 0.01905 is the scale imported maps are drawn at, so a 72 unit player is 1.37 m beside... [0.005..0.1]
# avatar_unit_metres: 0.01905
# Team avatars: the body each side wears in a team mode, in team order (comma list; an empty entry leaves tha...
# team_bodies: "fc_swat,fc_military"
# Directories searched in order for the team bodies' <id>.glb (comma list). The files are not in this reposit...
# team_body_dirs: "user://team_bodies,res://private/team_bodies"

# --- Kill rewards
# Health a headshot kill gives its killer (default 5). 0 gives none. [0.0..1000.0]
# headshot_heal: 5.0
# Most health a headshot's reward may lift a player to; a player spawns on player_health. 0 is unlimited. Oth... [0.0..10000.0]
# max_health_cap: 110.0
# Health every kill gives its killer, on top of a headshot's (default off). [0.0..1000.0]
# kill_reward_heal: 0.0
# Armour every kill gives its killer (default off). [0.0..1000.0]
# kill_reward_armour: 0.0
# Every kill gives its killer haste (a speed boost for a while; default off).
# kill_reward_haste: false
# Every kill gives its killer empowered (more damage for a while; default off).
# kill_reward_empowered: false

# --- Stomp
# Landing on a player's head hurts them.
# stomp_enabled: true
# Health a stomp takes; 0 kills outright. [0.0..1000.0]
# stomp_damage: 0.0
# Downward speed in m/s needed for a stomp. [0.0..100.0]
# stomp_min_speed: 4.0
# Metres the feet may be above or below the top of the head. [0.0..2.0]
# stomp_head_tolerance: 0.35
# Whether teammates can be stomped (ignores friendly fire).
# stomp_same_team: false
# Upward speed in m/s the stomper bounces with. [0.0..50.0]
# stomp_bounce: 8.0
# Seconds before the same player can stomp again. [0.0..30.0]
# stomp_cooldown_sec: 0.5
# Sound id played on a stomp (a dot-audio id).
# stomp_sound: "stomp"
# Effect id spawned on a stomp (a dot-fx id).
# stomp_effect: "stomp_puff"
