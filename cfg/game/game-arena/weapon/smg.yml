# Fatal Contact: smg recoil and damage. Only the keys changed from the fc-weapons pack; delete a key to fall back to it.
# pitch/yaw: degrees per shot (yaw alternates and drifts); build: extra kick per shot of a burst, capped at build_max;
# recovery: how fast the kick settles per second; aim: multiplier while aiming down sights (-1 = sv_recoil_mult_aim).
extra:
  tuning:
    recoil_pitch: 0.42
    recoil_yaw: 0.26
    recoil_build: 0.04
    recoil_build_max: 0.6
    recoil_recovery: 3.8
    # Damage per round (pack 16): 7 body rounds (469 ms) behind the rifle's 5 (375 ms) at close range; 18 is 6 (391 ms). fc-weapon-damage-audit-1.
    damage: 18.0
