# Fatal Contact: damage multiplier per hit group, over dot-combat's GSHitGroup.defaults() (head 4, neck 2, stomach 1.25,
# arm/leg/knee 0.75, hand/foot 0.5). Only the keys changed; delete one to fall back. fc_head_mult and friends still
# override at run time.
#
# Head x4 made the Assault Rifle (23) take 92 per head hit: one head plus one body round, 94 ms apart at 600 rpm,
# killed from full health, which reads as a one-shot (owner clip 2026-11-14, fc-weapon-damage-audit-1). x2 keeps the
# genre's rifle at 3 head / 5 body rounds and leaves the sniper, marksman, derringer and full charge a one-shot head.
# Neck and stomach count as chest while rules.hitzones is off (the FC default); their values matter only with it on.
# Table: /home/gamedev/perf-bench/weapon-damage-audit-20261114.md; bounds: examples/headless_hitzones.gd.
hit_groups:
  head: 2.0
  neck: 1.5
