# Every script parses, then every suite runs. The whole check is in gamespice-platform/ci,
# so that fixing it is one commit rather than one per repository; its README says what
# the inputs are and why a release does not touch the content origin.
#
# branches: ['**'] rather than [main] on purpose. Several repositories in this family
# sit on a task branch for days, and a main-only trigger is a check that reports
# nothing about the work anybody is actually doing -- the same assumption that made
# push-github.sh push a stale ref, succeed, and send nothing.
name: CI

on:
    push:
        branches: ['**']
        paths-ignore:
            - '**/*.md'
            - 'screenshots/**'
    pull_request:
    workflow_dispatch:

jobs:
    validate:
        uses: gamespice-platform/ci/.github/workflows/validate.yml@v1.4.5
        with:
            suite-timeout: 900
            # From v1.4.4 this also runs check-gd-perf.py over ci/efficiency/gd-perf-hot.txt
            # (ratchet ci/efficiency/gd-perf.tsv), the same gate as ./game.sh test. From v1.4.5 the
            # hot list's `addons: linked` also lints the linked addon repos with their own hot lists.
            efficiency: true
            perf: true
            # game.sh's SUITES, so the runner checks what a person checks, and release.yml
            # runs the same list. headless_lossy is in it again since 2026-10-09.
            suites: 'examples/headless_match examples/headless_net examples/headless_presentation examples/headless_stack examples/headless_admin examples/headless_imported examples/dedicated examples/headless_lossy'
            hygiene: true
            # The release's pack gates, run on every push: the static gate hard-fails (it
            # always fails the release), server-compat (default true) only warns until the addon is tagged.
            pack: true
            pack-deny: 'tmcdev(?:games)?\.net|x-tmc-dev'
        secrets:
            DEPS_TOKEN: ${{ secrets.GS_DEPS_TOKEN }}
